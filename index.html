<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Fortnite Building Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      user-select: none;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      color: white;
      background: rgba(0, 0, 0, 0.6);
      padding: 12px 20px;
      border-radius: 8px;
      pointer-events: none;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background: white;
      border: 1px solid black;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
  </style>
  <!-- Load Three.js Engine from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="hud">
    <h2>Fortnite 3D Builder</h2>
    <p><strong>Click screen</strong> to Lock Mouse & Play</p>
    <p><strong>WASD</strong> - Move | <strong>Space</strong> - Jump</p>
    <p><strong>Left Click</strong> - Place Build | <strong>Right Click</strong> - Destroy Build</p>
    <p><strong>Keys 1-3</strong>: [1] Wall | [2] Ramp | [3] Floor</p>
  </div>
  <div id="crosshair"></div>

  <script src="game.js"></script>
</body>
</html>
